<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Free In-Browser AI Demo</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; line-height: 1.6; }
    textarea { width: 100%; height: 80px; margin-bottom: 10px; padding: 8px; }
    button { padding: 10px 15px; font-size: 16px; cursor: pointer; }
    #status { font-weight: bold; color: #555; }
    #resultBox { margin-top: 20px; padding: 15px; border-radius: 6px; background: #f0f0f0; display: none; }
  </style>
</head>
<body>

  <h2>Browser-Based AI Assistant</h2>
  <p id="status">Loading AI model into browser memory... Please wait.</p>

  <textarea id="userInput" placeholder="Type something here (e.g., 'I love this product' or 'I am having trouble with my order')..." disabled></textarea>
  <br>
  <button id="analyzeBtn" onclick="runInference()" disabled>Analyze & Make Suggestion</button>

  <div id="resultBox">
    <strong>AI Output:</strong>
    <p id="aiOutput"></p>
  </div>

  <!-- Load Transformers.js directly from a free CDN -->
  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

    let classifier;

    async function loadModel() {
      // Loads a very light text classification model (~25MB download, cached after first load)
      classifier = await pipeline('sentiment-analysis', 'Xenova/distilbert-base-uncased-finetuned-sst-2-english');
      
      document.getElementById('status').innerText = 'AI Model Ready! Type below.';
      document.getElementById('status').style.color = 'green';
      document.getElementById('userInput').disabled = false;
      document.getElementById('analyzeBtn').disabled = false;
    }

    window.runInference = async function() {
      const text = document.getElementById('userInput').value;
      if (!text.trim()) return;

      document.getElementById('status').innerText = 'Analyzing text locally...';
      
      // Run the local ML model on the text
      const result = await classifier(text);
      const prediction = result[0]; // e.g. { label: 'POSITIVE', score: 0.99 }

      // Make a decision / suggestion based on the AI's understanding
      let suggestion = "";
      if (prediction.label === 'POSITIVE') {
        suggestion = `Suggestion: The user's text seems happy (Confidence: ${(prediction.score * 100).toFixed(1)}%). Action: Offer them a loyalty discount or ask for a review!`;
      } else {
        suggestion = `Suggestion: The user's text seems frustrated or negative (Confidence: ${(prediction.score * 100).toFixed(1)}%). Action: Route this directly to customer support!`;
      }

      document.getElementById('aiOutput').innerText = suggestion;
      document.getElementById('resultBox').style.display = 'block';
      document.getElementById('status').innerText = 'AI Model Ready!';
    };

    loadModel();
  </script>

</body>
</html>
